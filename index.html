<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101525">
  <meta name="description" content="The Last Train at 11:11 — a short, atmospheric interactive story.">
  <title>The Last Train at 11:11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="The Last Train home" id="brandHome"><span class="brand-mark">✳</span><span>AFTER HOURS <i>STORIES</i></span></a>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" aria-label="Toggle ambient sound" title="Ambient sound">♫</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">☼</button>
        <button class="icon-btn" id="menuBtn" aria-label="Story menu" title="Story menu">⋯</button>
      </div>
    </header>

    <section class="game-shell" aria-label="Visual novel game">
      <div class="game-meta"><span class="chapter-label" id="chapterLabel">A STORY IN FOUR STOPS</span><span class="progress-wrap"><span id="progressText">PROLOGUE</span><span class="progress-track"><i id="progressBar"></i></span></span></div>
      <section class="stage" id="stage" aria-live="polite">
        <div class="sky"></div><div class="city city-far"></div><div class="city city-near"></div>
        <div class="moon"></div><div class="stars"></div><div class="rain" id="rain"></div>
        <div class="window-frame"><span class="window-glint"></span><span class="window-divider"></span></div>
        <div class="scene-tag" id="sceneTag">NORTHBOUND · 11:11 PM</div>
        <div class="character character-left" id="character" aria-hidden="true"><div class="hair"></div><div class="face"><i class="eye eye-a"></i><i class="eye eye-b"></i><i class="mouth"></i></div><div class="neck"></div><div class="coat"></div><div class="scarf"></div></div>
        <div class="ambient-glow"></div>
        <div class="intro-card" id="introCard">
          <span class="eyebrow">A SHORT INTERACTIVE STORY</span>
          <h1>The Last Train<br><em>at 11:11</em></h1>
          <p>Some goodbyes take the long way home.</p>
          <button class="primary-btn" id="startBtn">Begin the journey <span>→</span></button>
          <div class="intro-foot"><span>10—15 MINUTES</span><b>✦</b><span>3 ENDINGS</span></div>
        </div>
        <div class="dialogue-wrap hidden" id="dialogueWrap">
          <div class="dialogue-card" id="dialogueCard">
            <div class="speaker-row"><span class="speaker" id="speaker"></span><span class="chapter-kicker" id="chapterKicker"></span></div>
            <p class="dialogue-text" id="dialogueText"></p>
            <div class="choice-list hidden" id="choices"></div>
            <button class="next-btn" id="nextBtn" aria-label="Continue dialogue"><span id="nextLabel">TAP TO CONTINUE</span><b>↓</b></button>
          </div>
        </div>
      </section>
      <footer class="game-footer"><span><i class="live-dot"></i> YOUR STORY, YOUR PACE</span><span class="footer-controls"><kbd>SPACE</kbd> CONTINUE <span>·</span> <kbd>ESC</kbd> MENU</span></footer>
    </section>
    <div class="toast" id="toast" role="status"></div>

    <div class="modal-backdrop hidden" id="modalBackdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="Close">×</button>
        <span class="eyebrow">THE LAST TRAIN AT 11:11</span><h2 id="modalTitle">Story menu</h2>
        <div id="modalBody"></div>
      </section>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
